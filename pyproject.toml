[project]
name = "impactlens"
version = "0.1.0"
description = "Open reimplementation of an aerial impact-intelligence pipeline on public data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.6.0",
    "faiss-cpu>=1.15.1",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "psycopg[binary]>=3.3.8",
    "pypdf>=7.0.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.4.4",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
    "shapely>=2.2.0",
    "torch>=2.15.0",
]

[project.scripts]
impactlens = "impactlens.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

# On Linux (GitHub Actions CI), take torch from PyTorch's CPU-only index: the default Linux
# wheel pulls about 3 GB of CUDA libraries that CI never uses. macOS keeps the normal wheel
# (with the Apple Silicon "mps" backend).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impactlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI runs `pytest -m "not needs_data and not network"`; tests/conftest.py explains each marker.
markers = [
    "needs_data: needs local files that are gitignored (raw datasets, processed Valencia run, build/)",
    "network: calls a real web service (Earth Search, Overpass, Anthropic)",
    "postgis: needs the PostGIS database (docker compose locally, a service container in CI)",
]
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
