[project]
name = "impactlens"
version = "0.1.0"
description = "Open reimplementation of an aerial impact-intelligence pipeline on public data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.6.0",
    "faiss-cpu>=1.15.1",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "psycopg[binary]>=3.3.8",
    "pypdf>=7.0.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.4.4",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
    "shapely>=2.2.0",
    "torch>=2.15.0",
]

[project.scripts]
impactlens = "impactlens.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impactlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
